name: Daily GPF Market Sync & Telegram Broadcast

on:
  schedule:
    # 1. Weekdays (Mon-Fri) at 11:15 UTC (18:15 ICT Thailand time) - Daily Market Summary
    - cron: '15 11 * * 1-5'
    # 2. Saturdays at 03:00 UTC (10:00 ICT Thailand time) - Weekly Performance & Rebalance Alert
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Type of job to execute'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

concurrency:
  group: gpf-daily-job
  cancel-in-progress: false

jobs:
  daily-market-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Google Service Account
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > service_account.json
            echo "Service account credentials created from GitHub secret."
          fi

      - name: Run Market Sync & Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.6-flash'
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: 'service_account.json'
        run: |
          if [ "${{ inputs.job_type }}" = "weekly" ]; then
            python run_daily_job.py --weekly
          else
            python run_daily_job.py
          fi
